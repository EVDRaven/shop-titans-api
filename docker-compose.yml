services:
  app:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shoptitans-app

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html
    
    command: php artisan serve --host=0.0.0.0 --port=8000

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    container_name: shoptitans-postgres
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: shoptitans
      POSTGRES_DB: shoptitans

    ports:
      - "127.0.0.1:5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
